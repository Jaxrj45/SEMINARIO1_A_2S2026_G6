services:
  postgres-local:
    image: postgres:16
    container_name: cloudcinema-postgres-local
    restart: always
    environment:
      POSTGRES_DB: cloudcinema
      POSTGRES_USER: cloudcinema_user
      POSTGRES_PASSWORD: cloudcinema_pass
    ports:
      - "5432:5432"
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ../database/sps:/docker-entrypoint-initdb.d
      - ../database/seed.sql:/docker-entrypoint-initdb.d/z_seed.sql

  localstack:
    image: localstack/localstack:3
    container_name: cloudcinema-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1