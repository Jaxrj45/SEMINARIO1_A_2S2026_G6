version: "3.8"
services:
  mysql-local:
    image: mysql:8.0
    container_name: cloudcinema-mysql-local
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: cloudcinema
      MYSQL_USER: cloudcinema_user
      MYSQL_PASSWORD: cloudcinema_pass
    ports:
      - "3306:3306"
    volumes:
      - ./src/schema.sql:/docker-entrypoint-initdb.d/schema.sql